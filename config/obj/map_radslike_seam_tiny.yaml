# Low-strength, target-aware continuity for decoder unpatch adaptation.
objectives:
- name: PolarOccupancy
  args:
    weight: 1.0
    positive_weight: 16.0
    max_range: 64.0
    el_span: 0.7853981633974483
    az_span: 1.5707963267948966
    range_weighted: True
    seam_weight: 0.002
    seam_patch: [8, 8, 8]
    seam_context_radius: 2

dataset:
  channels:
    map:
      name: RawChannel
      indices: lidar
      args:
        sensor: lidar
        channel: rng
        transform:
        - name: Destagger
          args: {}
        - name: Map3D
          args:
            decimate: [2, 8, 4]
            crop_az: 0.25

decoder:
  args:
    key: map
    pos_scale: [1.0, 1.0, 1.0]
    shape: [64, 128, 64]
    patch: [8, 8, 8]
